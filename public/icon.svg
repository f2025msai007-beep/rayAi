<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Soundwaves / Bluetooth sync aura -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" />

  <!-- Smart Glasses Frame (Wayfarer Style) -->
  <g transform="translate(0, 10)">
    <!-- Bridge -->
    <path d="M 230 220 Q 256 208 282 220" fill="none" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Left Temple Joint -->
    <path d="M 80 200 L 120 212" fill="none" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round" />
    <!-- Right Temple Joint -->
    <path d="M 432 200 L 392 212" fill="none" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Left Frame & Lens -->
    <rect x="110" y="200" width="120" height="96" rx="28" fill="url(#lensGrad)" stroke="url(#frameGrad)" stroke-width="10" />
    <!-- Left Lens Reflection -->
    <path d="M 126 216 L 190 216" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.3" />
    <!-- Left Camera Dot (Meta Ray-Ban LED/Sensor) -->
    <circle cx="124" cy="214" r="4.5" fill="#38bdf8" />
    <circle cx="124" cy="214" r="2" fill="#ffffff" />

    <!-- Right Frame & Lens -->
    <rect x="282" y="200" width="120" height="96" rx="28" fill="url(#lensGrad)" stroke="url(#frameGrad)" stroke-width="10" />
    <!-- Right Lens Reflection -->
    <path d="M 298 216 L 362 216" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.3" />
    <!-- Right Capture LED Indicator -->
    <circle cx="388" cy="214" r="4.5" fill="#a855f7" />
    <circle cx="388" cy="214" r="2" fill="#ffffff" />

    <!-- HUD Subtitle / Translation Beam -->
    <g transform="translate(140, 240)">
      <line x1="10" y1="0" x2="60" y2="0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
      <line x1="10" y1="12" x2="45" y2="12" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
    </g>
    <g transform="translate(312, 240)">
      <line x1="10" y1="0" x2="60" y2="0" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
      <line x1="10" y1="12" x2="45" y2="12" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
    </g>

    <!-- Bluetooth & Audio Pulse Badge (Bottom Center) -->
    <g transform="translate(256, 350)">
      <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
      <!-- Bluetooth icon symbol -->
      <path d="M -24 -8 L -16 0 L -24 8 M -20 -12 L -20 12 L -14 6 L -26 -6 L -20 -12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Audio bars -->
      <rect x="-4" y="-8" width="3" height="16" rx="1.5" fill="#38bdf8" />
      <rect x="4" y="-12" width="3" height="24" rx="1.5" fill="#6366f1" />
      <rect x="12" y="-6" width="3" height="12" rx="1.5" fill="#a855f7" />
      <rect x="20" y="-10" width="3" height="20" rx="1.5" fill="#ec4899" />
    </g>
  </g>
</svg>
